<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haunt Any Page</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="header">
      <img src="../../assets/icons/icon-48.png" alt="" width="26" height="26" class="icon">
      <h1 class="wordmark">Haunt Any Page</h1>
    </header>
    
    <p class="status">
      <span class="origin"></span>
      <span class="state-text"></span>
    </p>
    
    <button type="button" class="primary-button" id="toggleButton" aria-pressed="false">
      <span class="button-text"></span>
    </button>
    
    <div class="effects" id="effects">
      <div class="effect-row">
        <label for="fogCheckbox">Fog</label>
        <input type="checkbox" id="fogCheckbox" class="checkbox">
      </div>
      
      <div class="effect-row density-row" id="densityRow" hidden>
        <label for="densitySlider" class="density-label">Density</label>
        <input type="range" id="densitySlider" class="slider" min="0" max="100" value="55">
      </div>
      
      <div class="effect-row">
        <label for="batsCheckbox">Bats</label>
        <input type="checkbox" id="batsCheckbox" class="checkbox">
      </div>
      
      <div class="effect-row">
        <label for="fontCheckbox">Old-book font</label>
        <input type="checkbox" id="fontCheckbox" class="checkbox">
      </div>
      
      <div class="effect-row">
        <label for="flickerCheckbox">Candle flicker</label>
        <input type="checkbox" id="flickerCheckbox" class="checkbox">
      </div>
    </div>
    
    <hr class="hairline">
    
    <div class="remember-row">
      <div class="remember-content">
        <label for="rememberCheckbox" class="remember-label">Haunt this site every time</label>
        <p class="hint">Chrome will ask once for access to this site. Settings stay on this device.</p>
      </div>
      <input type="checkbox" id="rememberCheckbox" class="checkbox">
    </div>
    
    <div class="unsupported" id="unsupported">
      <p>This page can't be haunted.</p>
    </div>
  </div>
  
  <script src="popup.js" type="module"></script>
</body>
</html>
